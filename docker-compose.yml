version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: yourrank-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: yourrank
      POSTGRES_PASSWORD: yourrank_secret
      POSTGRES_DB: yourrank
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yourrank"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: yourrank-api
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: yourrank
      DB_PASSWORD: yourrank_secret
      DB_NAME: yourrank
      JWT_SECRET: change-me-in-production
      SERVER_PORT: 8080
      UPLOAD_DIR: /app/uploads
    ports:
      - "8080:8080"
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: yourrank-web
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
